name: Pact contract verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pact-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  consumer-pact:
    name: Consumer Pact tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/sample-api/pact-workshop-js/consumer/package-lock.json

      - name: Install consumer dependencies
        working-directory: src/sample-api/pact-workshop-js/consumer
        run: npm ci

      - name: Generate and test consumer Pact
        working-directory: src/sample-api/pact-workshop-js/consumer
        run: npm run test:pact

      - name: Upload generated Pact
        uses: actions/upload-artifact@v4
        with:
          name: consumer-pacts
          path: src/sample-api/pact-workshop-js/consumer/pacts/*.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish Pact to Pactflow Broker
        working-directory: src/sample-api/pact-workshop-js/provider
        env:
          PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_BASE_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
          GIT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: node publish-pact.js

  provider-verification:
    name: Provider Pact verification
    needs: consumer-pact
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/sample-api/pact-workshop-js/provider/package-lock.json

      - name: Install provider dependencies
        working-directory: src/sample-api/pact-workshop-js/provider
        run: npm ci

      - name: Download consumer Pact
        uses: actions/download-artifact@v4
        with:
          name: consumer-pacts
          path: src/sample-api/pact-workshop-js/consumer/pacts

      - name: Verify Pact against provider & publish results
        working-directory: src/sample-api/pact-workshop-js/provider
        env:
          CI: true
          PACT_BROKER_URL: ${{ secrets.PACT_BROKER_BASE_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
          PACT_PUBLISH_RESULTS: "true"
          PACT_FILE: ${{ github.workspace }}/src/sample-api/pact-workshop-js/consumer/pacts/FrontendWebsite-ProductService.json
          GIT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: npm run test:pact

  # ─────────────────────────────────────────────────────────────────────────────
  # Quality Gate: can-i-deploy
  # ─────────────────────────────────────────────────────────────────────────────
  can-i-deploy:
    name: Can-I-Deploy quality gate
    needs: provider-verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Pact Broker credentials — set trong GitHub → Settings → Secrets → Actions
      PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_BASE_URL }}
      PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
      # SHA của commit hiện tại — dùng làm pacticipant version
      GIT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Cài Pact CLI standalone (Ruby-based) từ GitHub releases.
      - name: Install Pact CLI standalone
        run: |
          curl -fsSL https://raw.githubusercontent.com/pact-foundation/pact-ruby-standalone/master/install.sh | bash
          echo "${HOME}/.pact/bin" >> "$GITHUB_PATH"

      # Kiểm tra consumer (FrontendWebsite) có thể deploy không (so với branch main).
      - name: Can-I-Deploy — FrontendWebsite (consumer)
        run: |
          pact-broker can-i-deploy \
            --pacticipant FrontendWebsite \
            --version "$GIT_COMMIT" \
            --to main \
            --broker-base-url "$PACT_BROKER_BASE_URL" \
            --broker-token "$PACT_BROKER_TOKEN"

      # Kiểm tra provider (ProductService) có thể deploy không (so với branch main).
      - name: Can-I-Deploy — ProductService (provider)
        run: |
          pact-broker can-i-deploy \
            --pacticipant ProductService \
            --version "$GIT_COMMIT" \
            --to main \
            --broker-base-url "$PACT_BROKER_BASE_URL" \
            --broker-token "$PACT_BROKER_TOKEN"
